server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flight}
    username: ${DB_USER:flight}
    password: ${DB_PASSWORD:flight_demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: always
grpc:
  api-key: ${GRPC_API_KEY}
  port: ${GRPC_PORT:9090}
  host: ${GRPC_HOST:localhost}
  deadline-ms: ${GRPC_DEADLINE_MS:1000}
  backoff-ms: ${GRPC_BACKOFF_MS:100}
  cb-failure-threshold: ${CB_FAILURE_THRESHOLD:5}
  cb-open-millis: ${CB_OPEN_MILLIS:10000}
cache:
  ttl-seconds: ${CACHE_TTL_SECONDS:600}
redis:
  sentinel-master: ${REDIS_SENTINEL_MASTER:mymaster}
  sentinel-nodes: ${REDIS_SENTINEL_NODES:localhost:26379}
